<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathéo Gérardin — UX/UI Designer</title>
<meta name="description" content="Contact et portfolio de Mathéo Gérardin, UX/UI Designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Instrument+Serif&display=swap">
<style>
  :root { --bg: #1E1E1E; --text: #F2F4F5; --muted: #A9B0B8; --line: #3A3A3A; --sel: #0D99FF; --accent: #2EC4C7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 20px;
    background-color: var(--bg); background-image: radial-gradient(#363636 1.2px, transparent 1.2px); background-size: 24px 24px;
    font-family: 'Geist', 'Inter', system-ui, sans-serif; color: var(--text); }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px; }
  .label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: var(--sel); margin-bottom: 6px; }
  .frame { position: relative; display: inline-block; padding: 8px 16px 12px; border: 2px solid var(--sel); }
  .frame span { position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid var(--sel); }
  .tl { left: -6px; top: -6px; } .tr { right: -6px; top: -6px; } .bl { left: -6px; bottom: -6px; } .br { right: -6px; bottom: -6px; }
  h1 { margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 11vw, 54px); line-height: 1.04; }
  .role { margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  p.intro { margin: 0; font-size: 17px; line-height: 1.6; color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 12px; }
  a.btn { display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 20px; border-radius: 12px;
    border: 1px solid var(--line); background: #262626; color: var(--text); font-size: 16px; font-weight: 500; text-decoration: none; }
  a.btn:hover, a.btn:focus-visible { border-color: var(--sel); outline: none; }
  a.btn.primary { background: var(--text); color: #111; border-color: var(--text); }
  a.btn .hint { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: var(--muted); }
  a.btn.primary .hint { color: #555; }
  footer { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #7C838B; }
</style>
</head>
<body>
<main>
  <div>
    <p class="role">UX/UI Designer</p>
  </div>
  <div>
    <div class="label">Nom</div>
    <div class="frame">
      <h1>Mathéo Gérardin</h1>
      <span class="tl" aria-hidden="true"></span><span class="tr" aria-hidden="true"></span><span class="bl" aria-hidden="true"></span><span class="br" aria-hidden="true"></span>
    </div>
  </div>
  <p class="intro">Je conçois des interfaces métier pour celles et ceux qui travaillent sur le terrain : applications mobiles, tableaux de bord et design system.</p>
  <nav aria-label="Liens de contact">
    <a class="btn primary" href="https://blessed-terms-016845.framer.app">Voir mon portfolio <span class="hint" aria-hidden="true">→</span></a>
    <a class="btn" href="https://www.linkedin.com/in/matheo-gerardin/">LinkedIn <span class="hint">/in/matheo-gerardin</span></a>
    <a class="btn" href="mailto:gerardinmatheo@gmail.com">M’écrire <span class="hint">E-mail</span></a>
    <a class="btn" href="contact/matheo-gerardin.vcf" download>Ajouter à mes contacts <span class="hint">.vcf</span></a>
  </nav>
  <footer>© 2026 Mathéo Gérardin</footer>
</main>
</body>
</html>
